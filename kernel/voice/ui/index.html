<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guppy</title>
<style>
  :root { --bg: #14171c; --fg: #d8dde4; --muted: #8a93a0; --accent: #e8923a; --panel: #1d2128; --line: #2c323c; --me: #7fb3ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  #state { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  #log { position: fixed; top: 16px; left: 16px; right: 16px; max-width: 560px; max-height: 38vh; overflow-y: auto;
         display: flex; flex-direction: column; gap: 6px; mask-image: linear-gradient(to bottom, transparent, #000 24px); padding-top: 24px; }
  .line { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .line.me { color: var(--me); align-self: flex-end; }
  .line b { color: var(--muted); font-weight: 500; margin-right: 6px; }
  #tasks { position: fixed; right: 16px; bottom: 64px; width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 6px; }
  .task { background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--muted);
          border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .task.running { border-left-color: var(--accent); } .task.done { border-left-color: #5cb85c; } .task.failed, .task.cancelled { border-left-color: #d9534f; }
  .task .meta { color: var(--muted); font-size: 12px; }
  /* ---- pet mode (?pet): a floating head for the GuppyPet app ---- */
  body.pet, body.pet html { background: transparent; }
  body.pet #log, body.pet #hud, body.pet #tasks { display: none; }
  #ring { display: none; }
  body.pet #ring { display: block; position: fixed; left: 50%; bottom: 10px; width: 46%; height: 6px; transform: translateX(-50%);
    border-radius: 3px; background: #8a93a0; opacity: .55; transition: background .25s, opacity .25s, box-shadow .25s; }
  body.pet #ring.listening { background: #35bdff; opacity: .9; box-shadow: 0 0 10px #35bdff; }
  body.pet #ring.hearing { background: #5cf0ff; opacity: 1; box-shadow: 0 0 14px #5cf0ff; }
  body.pet #ring.thinking { background: #ff9a45; opacity: .9; box-shadow: 0 0 10px #ff9a45; animation: pulse 1s ease-in-out infinite; }
  body.pet #ring.speaking { background: #ff9a45; opacity: 1; box-shadow: 0 0 14px #ff9a45; }
  body.pet #ring.muted { background: #d9534f; opacity: .8; }
  body.pet #ring.asleep { background: #35bdff; opacity: .22; box-shadow: none; }
  body.pet #ring.offline { background: #555; opacity: .6; }
  @keyframes pulse { 50% { opacity: .35; } }
  #bubble { display: none; }
  body.pet #bubble { display: block; position: fixed; left: 8px; right: 8px; top: 6px; padding: 6px 9px; border-radius: 10px;
    background: rgba(11, 19, 26, .88); border: 1px solid #2c323c; color: #f5f7fa; font-size: 12px; line-height: 1.35;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  body.pet #bubble.show { opacity: 1; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="log"></div>
<div id="bubble"></div>
<div id="ring" class="offline"></div>
<div id="tasks"></div>
<div id="hud">
  <button id="connect">🎙 Talk to Guppy</button>
  <span id="state">offline</span>
</div>
<audio id="remote" autoplay playsinline></audio>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const $ = (id) => document.getElementById(id);
const setState = (s) => $("state").textContent = s;
const TEST = new URLSearchParams(location.search).has("test");  // feed a WAV as the "mic" (for automated checks)
const PET = new URLSearchParams(location.search).has("pet");    // floating-head mode for the GuppyPet app
if (PET) { document.body.classList.add("pet"); document.documentElement.style.background = "transparent"; }
let muted = false;
let awake = true, wakeEnabled = false;  // server tells us (wake word gate)
function petState(s) {  // ring + tell the native app (if any)
  if (s !== "offline" && !muted && wakeEnabled && !awake && (s === "listening" || s === "asleep")) s = "asleep";
  const shown = muted ? "muted" : s;
  $("ring").className = shown;
  window.webkit?.messageHandlers?.guppy?.postMessage({ state: shown });
  if (!PET && shown === "asleep") setState('asleep: say "Guppy"');
}
let bubbleTimer;
function bubble(text) {
  if (!PET) return;
  const b = $("bubble"); b.textContent = text; b.classList.add("show");
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => b.classList.remove("show"), 7000);
}

// ---------------- avatar ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: PET });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); if (!PET) scene.background = new THREE.Color(0x14171c);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const key = new THREE.DirectionalLight(0xfff1e0, 2.2); key.position.set(2, 1.5, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.2); rim.position.set(-2, 1, -1.5); scene.add(rim);
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 20);
const headBox = new THREE.Box3();
function frame() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (headBox.isEmpty()) return;
  const size = headBox.getSize(new THREE.Vector3()), c = headBox.getCenter(new THREE.Vector3());
  const vFov = THREE.MathUtils.degToRad(camera.fov), hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const dist = 1.05 * Math.max((size.y / 2) / Math.tan(vFov / 2), (size.x / 2) / Math.tan(hFov / 2)) + size.z * 0.25;
  camera.position.set(c.x + dist * 0.18, c.y + size.y * 0.05, c.z + dist);
  camera.lookAt(c.x, c.y - size.y * 0.04, c.z);
}
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); frame(); });

const morphs = {};
const rig = new THREE.Group(); scene.add(rig);
new GLTFLoader().load("avatar/guppy_head.glb", (gltf) => {
  gltf.scene.rotation.y = -Math.PI / 2;  // Blender +X face -> camera
  rig.add(gltf.scene);
  const full = new THREE.Box3().setFromObject(gltf.scene);
  headBox.copy(full); headBox.min.y = full.max.y - (full.max.y - full.min.y) * (PET ? 0.62 : 0.75);
  gltf.scene.traverse((o) => {
    if (o.isMesh && o.morphTargetDictionary)
      for (const [name, index] of Object.entries(o.morphTargetDictionary)) (morphs[name] ||= []).push({ mesh: o, index });
  });
  frame();
}, undefined, () => setState("avatar model missing (body/avatar/guppy_head.glb)"));
const setMorph = (name, v) => { for (const m of morphs[name] || []) m.mesh.morphTargetInfluences[m.index] = v; };

const MOODS = {
  deadpan:     { mouthSmile: 0,   mouthFrown: 0,   mouthPress: 0.2, sway: 0.8 },
  pleased:     { mouthSmile: 0.4, mouthFrown: 0,   mouthPress: 0,   sway: 1 },
  smug:        { mouthSmile: 0.7, mouthFrown: 0,   mouthPress: 0.3, sway: 0.6 },
  exasperated: { mouthSmile: 0,   mouthFrown: 0.8, mouthPress: 0.2, sway: 1.4 },
  alarmed:     { mouthSmile: 0,   mouthFrown: 0.3, mouthPress: 0,   sway: 0.3, jawBias: 0.25 },
};
let mood = MOODS.deadpan;

// ---------------- conversation log ----------------
function say(who, text) {
  const d = document.createElement("div"); d.className = "line" + (who === "you" ? " me" : "");
  d.innerHTML = `<b>${who === "you" ? "Admiral" : "Guppy"}</b>`; d.append(text);
  $("log").append(d); $("log").scrollTop = 1e9; return d;
}
let botLine = null;

// ---------------- Mind task HUD ----------------
const taskEls = {};
function showTask(tk) {
  let el = taskEls[tk.id];
  if (!el) { el = taskEls[tk.id] = document.createElement("div"); $("tasks").prepend(el); }
  el.className = "task " + tk.status;
  const detail = tk.status === "running" ? (tk.tool ? `using ${tk.tool}` : "working") : (tk.summary || tk.error || tk.status);
  el.innerHTML = `<div class="meta">#${tk.id} · ${tk.provider} · ${tk.status}</div>`;
  el.append(tk.goal.slice(0, 90), Object.assign(document.createElement("div"), { className: "meta", textContent: detail }));
  if (["done", "failed", "cancelled"].includes(tk.status)) setTimeout(() => { el.remove(); delete taskEls[tk.id]; }, 60000);
}

// ---------------- WebRTC ----------------
let pc, dc, ctx, analyser, freq, time;
const t = { speechEnd: 0 };

async function micStream() {
  if (!TEST) return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  // Test mode: play test.wav (after ~12s, once the greeting is done) into a synthetic mic track.
  // A faint noise floor keeps frames flowing like a real mic (silent tracks stop sending).
  const dest = ctx.createMediaStreamDestination();
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * 0.001;
  const floor = ctx.createBufferSource(); floor.buffer = noise; floor.loop = true; floor.connect(dest); floor.start();
  const buf = await ctx.decodeAudioData(await (await fetch("test.wav")).arrayBuffer());
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(dest);
  src.start(ctx.currentTime + 12);
  src.onended = () => { t.speechEnd = performance.now(); };
  return dest.stream;
}

async function connect() {
  ctx = new AudioContext(); await ctx.resume();
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.3;
  freq = new Float32Array(analyser.frequencyBinCount); time = new Float32Array(analyser.fftSize);

  setState("mic…");
  const mic = await micStream();
  pc = new RTCPeerConnection();
  micTrack = mic.getAudioTracks()[0]; micTrack.enabled = !muted;
  pc.addTransceiver(micTrack, { direction: "sendrecv" });
  pc.addTransceiver("video", { direction: "recvonly" });
  dc = pc.createDataChannel("rtvi", { ordered: true });
  dc.onopen = () => dc.send(JSON.stringify({ label: "rtvi-ai", type: "client-ready", id: crypto.randomUUID(),
                                             data: { version: "1.0.0", about: { library: "guppy-ui" } } }));
  dc.onmessage = (e) => onRtvi(JSON.parse(e.data));
  pc.ontrack = (e) => {
    if (e.track.kind !== "audio") return;
    const stream = new MediaStream([e.track]);
    $("remote").srcObject = stream;                        // playback
    if (TEST) $("remote").muted = true;  // automated checks must never talk over the Admiral's live Guppy
    if (TEST) $("remote").muted = true;  // automated checks must never talk over the Admiral's live Guppy
    ctx.createMediaStreamSource(stream).connect(analyser); // lip-sync analysis (not routed to speakers)
  };
  pc.onconnectionstatechange = () => {
    setState(pc.connectionState === "connected" ? "listening" : pc.connectionState);
    petState(pc.connectionState === "connected" ? "listening" : "offline");
    if (["failed", "closed", "disconnected"].includes(pc.connectionState)) hangup();
  };

  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((r) => pc.iceGatheringState === "complete" ? r() :
    pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && r()));
  setState("connecting…");
  const res = await fetch("api/offer", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }) });
  await pc.setRemoteDescription(await res.json());
  $("connect").textContent = "⏹ Hang up"; $("connect").classList.add("on");
}

function hangup() {
  if (PET) { petState("offline"); setTimeout(() => window.guppyPet.reconnect(), 5000); }
  try { pc?.close(); } catch {} pc = null;
  $("connect").textContent = "🎙 Talk to Guppy"; $("connect").classList.remove("on"); setState("offline");
}
$("connect").onclick = () => pc ? hangup() : connect().catch((e) => { setState("error: " + e.message); hangup(); });
if (TEST || PET) addEventListener("load", () => setTimeout(() => $("connect").click(), 500));
// Native app hooks (GuppyPet): click-to-mute, reconnect.
let micTrack = null;
window.guppyPet = {
  toggleMute() {
    muted = !muted; if (micTrack) micTrack.enabled = !muted;
    petState(pc ? "listening" : "offline"); bubble(muted ? "Muted. Mic is off." : (awake ? "Listening." : 'Say "Guppy".'));
    return muted;
  },
  wake() {  // click on the head: unmute if needed and wake Guppy without the wake word
    if (muted) { muted = false; if (micTrack) micTrack.enabled = true; }
    if (dc?.readyState === "open") dc.send(JSON.stringify({ label: "rtvi-ai", type: "client-message", id: crypto.randomUUID(),
                                                           data: { t: "wake", d: {} } }));
    bubble("Listening.");
  },
  isMuted: () => muted,
  reconnect() {  // keep trying until the kernel is back (it takes ~40 s to load its models after a restart)
    if (pc) return;
    connect().catch(() => { hangup(); });
  },
};

window.guppy = { get cur() { return cur; }, events: [], t };
function onRtvi(m) {
  if (m.label !== "rtvi-ai") return;
  window.guppy.events.push({ type: m.type, at: Math.round(performance.now()), data: m.data });
  switch (m.type) {
    case "user-started-speaking": setState("hearing you…"); petState("hearing"); break;
    case "user-stopped-speaking": setState("thinking…"); petState("thinking"); break;
    case "user-transcription": if (m.data?.final) say("you", m.data.text); break;
    case "bot-started-speaking": setState("speaking"); petState("speaking"); botLine = null; break;
    case "bot-stopped-speaking": setState(awake || !wakeEnabled ? "listening" : 'asleep: say "Guppy"'); petState("listening"); break;
    case "bot-output":  // once per sentence, as Guppy starts saying it
      if (m.data?.spoken_status !== "new") break;
      bubble(m.data?.text ?? "");
      if (!botLine) botLine = say("guppy", "");
      botLine.append((botLine.childNodes.length > 1 ? " " : "") + (m.data?.text ?? "")); $("log").scrollTop = 1e9;
      break;
    case "server-message":
      if (m.data?.type === "wake") {
        wakeEnabled = !!m.data.enabled; awake = !!m.data.awake;
        petState(awake ? "listening" : "asleep");
        if (!PET) setState(awake ? "listening" : 'asleep: say "Guppy"');
      }
      if (m.data?.type === "mood" && MOODS[m.data.mood]) mood = MOODS[m.data.mood];
      if (m.data?.type === "task") showTask(m.data.task);
      break;
    case "error": setState("error: " + (m.data?.error ?? "")); break;
  }
}

// ---------------- per-frame animation ----------------
function bandEnergy(lo, hi) {
  const hz = ctx.sampleRate / analyser.fftSize; let s = 0, n = 0;
  for (let i = Math.floor(lo / hz); i <= Math.ceil(hi / hz) && i < freq.length; i++) { s += Math.pow(10, freq[i] / 10); n++; }
  return s / Math.max(1, n);
}
const cur = { jawOpen: 0, mouthWide: 0, mouthRound: 0, mouthSmile: 0, mouthFrown: 0, mouthPress: 0, eyeBlink: 0 };
let nextBlink = performance.now() + 2000, blinkStart = -1;
const clock = new THREE.Clock();
const approach = (k, target, dt, up = 25, down = 12) => {
  cur[k] += (target - cur[k]) * (1 - Math.exp(-(target > cur[k] ? up : down) * dt));
};
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), tt = clock.elapsedTime, now = performance.now();
  let level = 0, bright = 0.5;
  if (analyser) {
    analyser.getFloatTimeDomainData(time); analyser.getFloatFrequencyData(freq);
    let rms = 0; for (const v of time) rms += v * v; rms = Math.sqrt(rms / time.length);
    level = Math.min(1, Math.max(0, (20 * Math.log10(rms + 1e-6) + 45) / 30));
    const low = bandEnergy(250, 900), high = bandEnergy(1800, 5000);
    bright = Math.min(1, Math.max(0, (high / (low + high + 1e-12) - 0.03) / 0.25));
  }
  const speaking = level > 0.05;
  approach("jawOpen", Math.min(1, level * 1.1 + (mood.jawBias || 0)), dt);
  approach("mouthWide", speaking ? Math.min(1, level * bright * 2.2) : 0, dt);
  approach("mouthRound", speaking ? Math.min(1, level * Math.max(0, 0.6 - bright) * 1.4) : 0, dt);
  approach("mouthSmile", mood.mouthSmile, dt, 4, 4);
  approach("mouthFrown", mood.mouthFrown, dt, 4, 4);
  approach("mouthPress", speaking ? 0 : mood.mouthPress, dt, 6, 6);
  if (blinkStart < 0 && now > nextBlink) blinkStart = now;
  if (blinkStart >= 0) {
    const p = (now - blinkStart) / 130;
    cur.eyeBlink = p < 1 ? p : p < 2 ? 2 - p : 0;
    if (p >= 2) { blinkStart = -1; nextBlink = now + 2000 + Math.random() * 4000; }
  }
  for (const k in cur) setMorph(k, cur[k]);
  const s = mood.sway;
  rig.rotation.y = Math.sin(tt * 0.31) * 0.06 * s;
  rig.rotation.x = Math.sin(tt * 0.23) * 0.02 * s - level * 0.03;
  rig.rotation.z = Math.sin(tt * 0.17) * 0.015 * s;
  rig.position.y = Math.sin(tt * 1.1) * 0.003;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
